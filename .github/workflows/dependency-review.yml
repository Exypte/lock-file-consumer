name: Dependency review

# Fails a pull request that adds a dependency with a known advisory, using the
# dependency graph diff between the base and head commits.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
