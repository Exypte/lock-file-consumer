name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-step:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        with:
          args: echo "docker:// step"

  job-container:
    runs-on: ubuntu-latest
    container: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    steps:
      - run: echo "inside job container"; cat /etc/os-release | head -2
