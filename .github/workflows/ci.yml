name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-step:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20
        with:
          args: echo "docker:// step"

  job-container:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: echo "inside job container"; cat /etc/os-release | head -2
